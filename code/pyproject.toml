[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rival-arena"
version = "0.1.0"
description = "When Do Rival AIs Cooperate? — a factorial arena for LLM cooperation, defection, and collusion."
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["rival_arena*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
